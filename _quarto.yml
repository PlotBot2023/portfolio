project:
  type: website
  output-dir: docs
  # The Broward Airbnb series is the only notebook set published; the others stay in the repo, unpublished.
  render:
    - "*.qmd"
    - "notebooks/broward-*.ipynb"
  # strips outside scripts, sets a Content-Security-Policy per page, writes robots.txt, restores .nojekyll, audits
  post-render: tools/harden_docs.py
  resources:
    - "assets/**"

# Notebooks are NOT re-executed at render time: they read from a local Postgres
# instance and local CSV exports that CI (and any other machine) cannot reach.
# Saved outputs are published as-is. To re-run a notebook, execute it in Jupyter
# and re-render, or flip `enabled: true` below on a machine with the data.
execute:
  enabled: false
  freeze: auto

website:
  title: "Richard Chute"
  description: "Data analysis, pipelines and applied modelling, Fort Lauderdale, Florida"
  site-url: "https://plotbot2023.github.io/portfolio"
  favicon: assets/favicon.svg
  open-graph: true
  twitter-card: true
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: projects.qmd
        text: Projects
      - href: about.qmd
        text: About
      - href: airbnb.qmd
        text: Airbnb case study
      - href: resume.qmd
        text: Resume

format:
  html:
    # Dark-only, in the Studies look (SportsAnalytics shared/brand STUDIES tokens, copied into styles.scss).
    theme: [darkly, styles.scss]
    highlight-style: github-dark
    css: styles.css
    toc: true
    # no code on the public site (the owner, 2026-11-15): notebook pages show their charts, tables and write-up only
    echo: false
    code-tools: false
    code-overflow: wrap
    df-print: paged
    fig-align: center
    link-external-newwindow: true
    smooth-scroll: true
    html-math-method: plain
    anchor-sections: true
    fig-responsive: true
