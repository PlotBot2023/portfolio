<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t">
  <title id="t">Rentals Archetypes: a brass telescope whose lens reads BnB</title>
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF4C2"/><stop offset=".35" stop-color="#FFC72C"/><stop offset=".7" stop-color="#B7791F"/><stop offset="1" stop-color="#FFE08A"/>
    </linearGradient>
    <radialGradient id="disc" cx=".45" cy=".35" r=".75">
      <stop offset="0" stop-color="#1E3260"/><stop offset=".6" stop-color="#101C36"/><stop offset="1" stop-color="#070D1A"/>
    </radialGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE6A0"/><stop offset=".45" stop-color="#E0A32E"/><stop offset="1" stop-color="#8A5412"/>
    </linearGradient>
    <radialGradient id="glass" cx=".36" cy=".3" r=".8">
      <stop offset="0" stop-color="#E9FDFF"/><stop offset=".3" stop-color="#7CF5FF"/><stop offset=".68" stop-color="#1596BE"/><stop offset="1" stop-color="#0A2F4C"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>

  <!-- the medallion: a polished gold ring, a dark parting line, a navy face -->
  <circle cx="256" cy="256" r="248" fill="url(#ring)"/>
  <circle cx="256" cy="256" r="230" fill="#04070E"/>
  <circle cx="256" cy="256" r="224" fill="url(#disc)"/>

  <!-- the night sky: a few stars in the site's accent hues -->
  <g opacity=".95">
    <circle cx="118" cy="132" r="5" fill="#FF7AE0"/><circle cx="150" cy="92" r="3" fill="#FFFFFF"/>
    <circle cx="92" cy="210" r="3.5" fill="#7CF5FF"/><circle cx="430" cy="300" r="4" fill="#4ADE9C"/>
    <circle cx="402" cy="372" r="3" fill="#FFFFFF"/><circle cx="196" cy="70" r="4" fill="#FFC72C"/>
  </g>

  <!-- the tripod -->
  <g stroke="#AEB8D2" stroke-width="13" stroke-linecap="round">
    <line x1="232" y1="352" x2="160" y2="452"/><line x1="232" y1="352" x2="300" y2="456"/><line x1="232" y1="352" x2="236" y2="466"/>
  </g>
  <circle cx="232" cy="352" r="16" fill="#6B7896"/>

  <!-- the tube, from the eyepiece at lower left up to the lens -->
  <line x1="138" y1="374" x2="292" y2="232" stroke="#3B250A" stroke-width="86" stroke-linecap="round"/>
  <line x1="138" y1="374" x2="292" y2="232" stroke="url(#brass)" stroke-width="74" stroke-linecap="round"/>
  <g stroke="#7A4A0E" stroke-width="7" stroke-linecap="round" opacity=".85">
    <line x1="168" y1="316" x2="220" y2="372"/><line x1="200" y1="286" x2="252" y2="342"/>
  </g>
  <circle cx="124" cy="388" r="26" fill="#5A3A10"/><circle cx="124" cy="388" r="15" fill="#0A2F4C"/>

  <!-- the lens, facing out, with BnB in the glass -->
  <circle cx="308" cy="212" r="132" fill="#7CF5FF" opacity=".35" filter="url(#glow)"/>
  <circle cx="308" cy="212" r="124" fill="#3B250A"/>
  <circle cx="308" cy="212" r="118" fill="url(#brass)"/>
  <circle cx="308" cy="212" r="98" fill="#04070E"/>
  <circle cx="308" cy="212" r="92" fill="url(#glass)"/>
  <ellipse cx="270" cy="168" rx="44" ry="22" fill="#FFFFFF" opacity=".38" transform="rotate(-28 270 168)"/>
  <text x="308" y="244" text-anchor="middle" font-family="'Segoe UI Black', 'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="88"
        fill="#FFFFFF" stroke="#06223A" stroke-width="7" paint-order="stroke" letter-spacing="-2">BnB</text>
</svg>
